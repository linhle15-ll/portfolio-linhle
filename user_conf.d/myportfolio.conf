limit_req_zone $binary_remote_addr zone=timeline_post_limit:10m rate=1r/m;

server {
    listen 80;
    server_name linhthechef.duckdns.org;

    if ($host = linhthechef.duckdns.org) {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name linhthechef.duckdns.org;

    location / {
        proxy_pass http://myportfolio:5000/;
    }

    location /api/timeline_post {
        limit_req zone=timeline_post_limit burst=1 nodelay;
        proxy_pass http://myportfolio:5000/api/timeline_post;
    }

    ssl_certificate /etc/letsencrypt/live/linhthechef.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linhthechef.duckdns.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/linhthechef.duckdns.org/chain.pem;
}